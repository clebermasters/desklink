name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        # macOS UI acceptance is deferred until a native test Mac is available.
        # The Wayland tests run this job's binary inside a Debian trixie container (glibc 2.41),
        # so build on a runner whose glibc is not newer: ubuntu-24.04 has 2.39, 26.04 has 2.43.
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +stable test --workspace --locked
      - run: cargo +stable build --locked
      - name: Install isolated desktop test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool xclip x11-utils python3-pil imagemagick libxkbcommon-x11-0 libegl1 libgl1-mesa-dri fonts-dejavu-core
      - name: Verify two-desktop input and clipboard sharing
        if: runner.os == 'Linux'
        run: /usr/bin/python3 tests/x11_e2e.py
      - name: Verify shared layout and native UI
        run: |
          /usr/bin/python3 tests/layout_e2e.py
          /usr/bin/python3 tests/ui_e2e.py --sharing
      - name: Build isolated Wayland desktop
        run: docker build -f tests/environments/wayland.Dockerfile -t desklink-wayland-test .
      - name: Verify native Wayland editor
        run: docker run --rm --init --user 1000:1000 --network none --mount type=bind,src="$PWD",dst=/workspace,readonly desklink-wayland-test python3 tests/ui_e2e.py --wayland
      - name: Verify GNOME portal permissions, input and clipboard
        run: docker run --rm --init --user 1000:1000 --network none --mount type=bind,src="$PWD",dst=/workspace,readonly desklink-wayland-test python3 tests/ui_e2e.py --wayland --headless --sharing --approve-gnome
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Rust Android targets and cargo-ndk
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;36.0.0" "ndk;29.0.14206865"
      - name: Clippy for Android targets
        # ANDROID_HOME is a runner environment variable, not part of the workflow `env` context.
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          cargo ndk -t arm64-v8a -t x86_64 -P 26 clippy -p desklink-android --release --locked -- -D warnings
      - name: Lint and build the app
        working-directory: android
        run: ./gradlew --no-daemon lintDebug assembleDebug assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: desklink-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
  static-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build -p desklink --release --locked --no-default-features --target x86_64-unknown-linux-musl
      - name: Verify no dynamic library dependencies
        run: |
          file target/x86_64-unknown-linux-musl/release/desklink
          if readelf -l target/x86_64-unknown-linux-musl/release/desklink | grep -q INTERP; then exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: desklink-linux-x86_64-headless
          path: target/x86_64-unknown-linux-musl/release/desklink
