[package]
name = "desklink-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Android receiver: hosts the Desklink agent inside the Android app through JNI"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
desklink = { path = "../cli", default-features = false }
desklink-hid.workspace = true
desklink-platform.workspace = true
desklink-protocol.workspace = true
desklink-settings.workspace = true
desklink-transport.workspace = true
anyhow.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
tempfile.workspace = true
