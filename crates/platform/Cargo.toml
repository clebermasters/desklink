[package]
name = "desklink-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
desklink-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb.workspace = true
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "input_capture", "remote_desktop", "clipboard", "screencast"] }
reis = { version = "0.7.1", features = ["tokio"] }
futures-util = "0.3"
rustix = { version = "1", features = ["fs", "time"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing.workspace = true
