[package]
name = "desklink-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
desklink-layout.workspace = true
desklink-settings.workspace = true
desklink-protocol.workspace = true
desklink-transport.workspace = true
eframe = {version="0.37.0",default-features=false,features=["glow","default_fonts","x11","wayland","clipboard"]}
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
zbus = { version = "5", features = ["blocking-api"] }
winit = { version = "0.30.13", default-features = false, features = ["x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }

[dev-dependencies]
tempfile.workspace = true
